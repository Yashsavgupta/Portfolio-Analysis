[project]
name = "portfolio_evaluator_backend"
version = "0.1.0"
description = "FastAPI backend for Portfolio Evaluator"
authors = [{ name = "Portfolio Evaluator Team", email = "team@example.com" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.11.1,<2",
    "email-validator>=2.0.0,<3",
    "fastapi>=0.111.1,<1",
    "kiteconnect>=4.3.0,<5",
    "openpyxl>=3.1.0,<4",
    "passlib[bcrypt]>=1.7.4,<1.8",
    "psycopg[binary]>=3.2.0,<4",
    "pydantic>=2.9.0,<3",
    "pydantic-settings>=2.0.0,<3",
    "python-dotenv>=1.0.0,<2",
    "python-jose[cryptography]>=3.1.0,<4",
    "python-multipart>=0.0.9,<1",
    "sqlalchemy>=2.0.32,<3",
    "uvicorn>=0.24.0,<1",
    "yfinance>=0.2.65,<1",
]


[tool.alembic]
script_location = "alembic"
sqlalchemy.url = "sqlite:///./portfolio_evaluator.db"


[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"
